{% load inventory_tags %}
<div class="table-panel table-responsive"><table class="table">
  <thead><tr><th scope="col">{{ heading }}</th><th scope="col">Партий</th><th scope="col">Предметов, шт.</th><th scope="col">Стоимость</th></tr></thead>
  <tbody>{% for entry in entries %}<tr><td>{{ entry.name }}</td><td>{{ entry.batches }}</td><td>{{ entry.units }}</td><td>{{ entry.total|money }} ₽</td></tr>{% empty %}<tr><td colspan="4">Нет данных.</td></tr>{% endfor %}</tbody>
</table></div>
